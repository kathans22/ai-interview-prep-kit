# Render blueprint — the API, on a free web service.
#
# Every variable in .env.example is declared here (test/deploy.test.js holds the two in
# step), with two exceptions: PORT, which Render injects, and FIXTURE_PORT, which only the
# local fixture sites use.
#
# Values marked `sync: false` are secrets or deployment URLs. Render asks for them when the
# blueprint is applied; they are never committed. SESSION_SECRET is generated by Render.
#
# FREE TIER: the service sleeps after 15 minutes without traffic, and the first request
# afterwards waits while it starts. A build interrupted by a restart is marked
# BUILD_INTERRUPTED at boot and can be continued from the kit page.

services:
  - type: web
    name: ai-interview-prep-kit-api
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # --- Runtime -----------------------------------------------------------
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # The deployed static site's origin, exactly — https, no trailing slash.
      - key: WEB_ORIGIN
        sync: false
      # Render's load balancer, plus the static host's /api proxy.
      - key: TRUST_PROXY_HOPS
        value: "2"

      # --- Datastore ---------------------------------------------------------
      # Atlas connection string, naming the database, e.g.
      # mongodb+srv://<user>:<password>@<cluster>/ai_interview_prep_kit?retryWrites=true&w=majority
      - key: MONGODB_URI
        sync: false
      - key: SESSION_SECRET
        generateValue: true

      # --- Gemini ------------------------------------------------------------
      # The key's Google Cloud project must stay UNBILLED.
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_MODEL_LIGHT
        value: gemini-3.5-flash-lite
      - key: GEMINI_RPD_LIGHT
        value: "500"
      - key: GEMINI_RPM
        value: "15"
      - key: GEMINI_TPM
        value: "250000"
      - key: GEMINI_RPD
        value: "500"
      - key: LLM_MAX_OUTPUT_TOKENS
        value: "8192"

      # --- Pipeline budgets --------------------------------------------------
      - key: MAX_LLM_CALLS_PER_KIT
        value: "12"
      - key: CASE_SOFT_DEADLINE_MS
        value: "150000"
      - key: BATCH_CONCURRENCY
        value: "2"
      - key: IDEMPOTENCY_WINDOW_MS
        value: "900000"

      # --- Retrieval ---------------------------------------------------------
      - key: SEARCH_PROVIDER
        value: tavily
      # Blank is allowed: the search then records an honest empty result.
      - key: SEARCH_API_KEY
        sync: false
      # FALSE in production. The server refuses to boot with it true when
      # NODE_ENV=production: the crawler must not reach private or loopback addresses.
      - key: ALLOW_PRIVATE_HOSTS
        value: "false"
      - key: CRAWL_MAX_PAGES
        value: "12"
      - key: CRAWL_MAX_DEPTH
        value: "2"
      - key: CRAWL_CONCURRENCY
        value: "3"
      - key: FETCH_TIMEOUT_MS
        value: "10000"
      - key: FETCH_MAX_BYTES
        value: "2000000"
